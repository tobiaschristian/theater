theater_newsletter.subscribe:
  path: '/newsletter/anmelden'
  defaults:
    _form: '\Drupal\theater_newsletter\Form\SubscribeForm'
    _title: 'Newsletter abonnieren'
  requirements:
    _access: 'TRUE'

theater_newsletter.confirm:
  path: '/newsletter/bestaetigen/{subscriber}/{token}'
  defaults:
    _form: '\Drupal\theater_newsletter\Form\ConfirmForm'
    _title: 'Newsletter-Anmeldung bestätigen'
  requirements:
    _access: 'TRUE'
    subscriber: '\d+'
    token: '[0-9a-f]{64}'

theater_newsletter.unsubscribe:
  path: '/newsletter/abmelden/{subscriber}/{token}'
  defaults:
    _form: '\Drupal\theater_newsletter\Form\UnsubscribeForm'
    _title: 'Vom Newsletter abmelden'
  requirements:
    _access: 'TRUE'
    subscriber: '\d+'
    token: '[0-9a-f]{64}'

theater_newsletter.admin_approve:
  path: '/admin/theater-newsletter/abonnenten/{newsletter_subscriber}/freigeben'
  defaults:
    _form: '\Drupal\theater_newsletter\Form\SubscriberApproveForm'
    _title: 'Anmeldung freigeben'
  requirements:
    _permission: 'administer theater_newsletter'
    newsletter_subscriber: '\d+'
  options:
    parameters:
      newsletter_subscriber:
        type: entity:newsletter_subscriber
